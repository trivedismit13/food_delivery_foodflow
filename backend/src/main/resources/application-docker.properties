# Docker profile — DB points to the 'mysql' Compose service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

# Allow requests from the frontend container (browser resolves to localhost)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.com.foodflow=INFO

# DEV-SEED EXCLUSION: V35 dev-only data must not run in Docker/prod environments
# V35 is now physically separated into db/migration/dev which is not scanned by default.
