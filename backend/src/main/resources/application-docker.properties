# Docker profile — DB points to the 'mysql' Compose service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

# Allow requests from the frontend container (browser resolves to localhost)
# Removed app.cors.allowed-origins since CORS_ALLOWED_ORIGINS is injected directly by docker-compose

google.oauth.client-id=${GOOGLE_CLIENT_ID:}

logging.level.com.foodflow=INFO
