# Read from environment variables in prod
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.com.foodflow=WARN

# ─────────────────────────────────────────────────────────────────────────────
# DEV-SEED EXCLUSION (PROD SAFETY)
# V35 contains realistic development data ONLY — it must never run in production.
# ignoreMigrationPatterns silently excludes V35 from the migration plan
# without disabling Flyway globally or requiring manual file removal.
# ─────────────────────────────────────────────────────────────────────────────
spring.flyway.ignore-migration-patterns=V35__*:*
