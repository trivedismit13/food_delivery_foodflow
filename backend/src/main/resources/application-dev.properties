# Dev database
spring.datasource.url=jdbc:mysql://localhost:3306/food_flow
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Show SQL in dev only
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT secret for dev (any long string is fine for local)
jwt.secret=${JWT_SECRET}

# CORS — allow frontend dev server
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.foodflow=DEBUG
logging.level.org.springframework.web=DEBUG

# Flyway - include dev specific migrations
spring.flyway.locations=classpath:db/migration,classpath:db/dev_migration
