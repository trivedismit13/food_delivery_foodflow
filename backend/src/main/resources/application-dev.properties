# Dev database
spring.datasource.url=jdbc:mysql://localhost:3306/food_flow
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Show SQL in dev only
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT secret for dev (any long string is fine for local)
jwt.secret=${JWT_SECRET:dev_secret_key_minimum_256_bits_long_replace_in_prod_abcdefghijklmnop}

# CORS — allow frontend dev server
app.cors.allowed-origins=http://localhost:5173

# Google OAuth (dev credentials from Google Console)
google.oauth.client-id=YOUR_DEV_GOOGLE_CLIENT_ID

# Logging
logging.level.com.foodflow=DEBUG
logging.level.org.springframework.web=DEBUG
