
# Shared config (both environments)
spring.application.name=foodflow

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100


# AI
ai.llm.provider=ollama
ai.llm.base-url=http://localhost:11434
ai.llm.model=llama3.2:1b
ai.drops.closing-soon-hours=2
ai.drops.low-stock-threshold=3

# JWT
jwt.expiration=86400000


spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html
server.compression.min-response-size=1024

