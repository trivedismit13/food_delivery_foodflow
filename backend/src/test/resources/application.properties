# Shared config (both environments)
spring.application.name=foodflow

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# AI
ai.llm.provider=ollama
ai.llm.base-url=http://localhost:11434
ai.llm.model=llama3.2:1b
ai.drops.closing-soon-hours=2
ai.drops.low-stock-threshold=3

# JWT
jwt.expiration=86400000
jwt.secret=${TEST_JWT_SECRET:test_jwt_secret_that_must_be_long_enough_to_be_secure_12345678901234567890}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html
server.compression.min-response-size=1024

google.oauth.client-id=YOUR_DEV_GOOGLE_CLIENT_ID

spring.datasource.url=jdbc:h2:mem:food_flow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable Flyway for tests and rely on Hibernate schema generation
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
